<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ລະບົບກອງທຶນ</title>
    
    <!-- ຕັ້ງຄ່າ PWA Icon ໃຫ້ມືຖືຈື່ໂລໂກ້ -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    
    <!-- Manifest ສຳລັບບັງຄັບໃຫ້ມືຖືຮູ້ຈັກໄອຄອນ -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">

    <!-- ລະບົບ Redirect ໄປຫາ Google Apps Script ຂອງທ່ານ (ປ່ຽນ URL ດ້ານລຸ່ມ) -->
    <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbwtGwCSMOhJLpjUvOpoB0Oih93UOrRTxmXb2FRd4tKwy2-3jRvv_0aCQN2-vAnrHjV9VQ/exec">
    
    <script>
        // ປ້ອງກັນບາງ Browser ທີ່ບໍ່ອ່ານ meta refresh
        window.location.href = "https://script.google.com/macros/s/AKfycbwtGwCSMOhJLpjUvOpoB0Oih93UOrRTxmXb2FRd4tKwy2-3jRvv_0aCQN2-vAnrHjV9VQ/exec";
    </script>
</head>
<body>
    <p>ກຳລັງໂຫຼດເຂົ້າສູ່ລະບົບ...</p>
</body>
</html>
